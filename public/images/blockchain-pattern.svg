<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="blockchainPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Base hexagon network -->
      <circle cx="50" cy="50" r="4" fill="#ffffff" opacity="0.3" />
      <circle cx="150" cy="50" r="4" fill="#ffffff" opacity="0.3" />
      <circle cx="100" cy="120" r="4" fill="#ffffff" opacity="0.3" />
      <circle cx="100" cy="30" r="4" fill="#ffffff" opacity="0.3" />
      <circle cx="50" cy="150" r="4" fill="#ffffff" opacity="0.3" />
      <circle cx="150" cy="150" r="4" fill="#ffffff" opacity="0.3" />
      
      <!-- Connection lines -->
      <line x1="50" y1="50" x2="150" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.15" />
      <line x1="50" y1="50" x2="100" y2="120" stroke="#ffffff" stroke-width="1" opacity="0.15" />
      <line x1="50" y1="50" x2="100" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.15" />
      <line x1="150" y1="50" x2="100" y2="120" stroke="#ffffff" stroke-width="1" opacity="0.15" />
      <line x1="150" y1="50" x2="100" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.15" />
      <line x1="50" y1="150" x2="100" y2="120" stroke="#ffffff" stroke-width="1" opacity="0.15" />
      <line x1="150" y1="150" x2="100" y2="120" stroke="#ffffff" stroke-width="1" opacity="0.15" />
      <line x1="50" y1="150" x2="150" y2="150" stroke="#ffffff" stroke-width="1" opacity="0.15" />
      
      <!-- Blockchain blocks -->
      <rect x="40" y="40" width="20" height="20" rx="3" fill="#ffffff" opacity="0.2" />
      <rect x="140" y="40" width="20" height="20" rx="3" fill="#ffffff" opacity="0.2" />
      <rect x="90" y="110" width="20" height="20" rx="3" fill="#ffffff" opacity="0.2" />
      <rect x="90" y="20" width="20" height="20" rx="3" fill="#ffffff" opacity="0.2" />
      <rect x="40" y="140" width="20" height="20" rx="3" fill="#ffffff" opacity="0.2" />
      <rect x="140" y="140" width="20" height="20" rx="3" fill="#ffffff" opacity="0.2" />
      
      <!-- Additional small connection dots -->
      <circle cx="75" cy="75" r="2" fill="#ffffff" opacity="0.2" />
      <circle cx="125" cy="85" r="2" fill="#ffffff" opacity="0.2" />
      <circle cx="65" cy="95" r="2" fill="#ffffff" opacity="0.2" />
      <circle cx="135" cy="105" r="2" fill="#ffffff" opacity="0.2" />
      <circle cx="75" cy="125" r="2" fill="#ffffff" opacity="0.2" />
      <circle cx="125" cy="40" r="2" fill="#ffffff" opacity="0.2" />
      
      <!-- Data flow animations -->
      <circle cx="75" cy="50" r="2" fill="#ffffff" opacity="0.5">
        <animate attributeName="cx" from="50" to="150" dur="5s" repeatCount="indefinite" />
      </circle>
      
      <circle cx="50" cy="75" r="2" fill="#ffffff" opacity="0.5">
        <animate attributeName="cx" from="50" to="100" dur="4s" repeatCount="indefinite" />
        <animate attributeName="cy" from="50" to="120" dur="4s" repeatCount="indefinite" />
      </circle>
      
      <circle cx="125" cy="100" r="2" fill="#ffffff" opacity="0.5">
        <animate attributeName="cx" from="150" to="100" dur="6s" repeatCount="indefinite" />
        <animate attributeName="cy" from="50" to="120" dur="6s" repeatCount="indefinite" />
      </circle>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#blockchainPattern)" />
</svg>
